[package]
name = "drawer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for SSH: your machines, a live shell and their files on one screen"
authors = ["Nakul Verma"]
license = "MIT"
repository = "https://github.com/nvrma/drawer"
homepage = "https://github.com/nvrma/drawer"
readme = "README.md"
keywords = ["ssh", "tui", "sftp", "terminal", "homelab"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["docs/*.png", ".github/", ".impeccable/"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3"
glob = "0.3.4"
libc = "0.2.191"
portable-pty = "0.9"
ratatui = "0.30"
russh-sftp = "3"
tokio = { version = "1.54.1", features = ["full"] }
tui-term = "0.3.4"
unicode-width = "0.2.3"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
