name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run drawer
        2. Select a machine and press Enter
        3. ...
  - type: input
    id: version
    attributes:
      label: drawer version
      placeholder: output of `drawer --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, terminal and ssh version
      placeholder: e.g. Arch Linux, Ghostty, OpenSSH_10.0p1
  - type: markdown
    attributes:
      value: "**Security issue?** Please don't file it here. See SECURITY.md."
